# The name of the TrueNas pool hosting your data and these scripts.
POOL_NAME="YOURPOOL"
# The name of the TrueNas user that will running the script.
USER_NAME="YOURUSERNAME"

# The directory which will be pushed up to Proton Drive.
SOURCE_DIR="/mnt/${POOL_NAME}/Docs"
# The remote destination directory inside your Proton Drive.
REMOTE_DIR="/my-files/Home-NAS"

# The directory to store the upload state cache.
DB_DIR="/mnt/${POOL_NAME}/home/${USER_NAME}/proton_file_tracker"
# The path to the Proton Drive CLI binary.
PD_CLI="/mnt/${POOL_NAME}/home/${USER_NAME}/proton_file_tracker/proton-drive-cli-sync"

# Log configuration.
LOG_DIR="/mnt/${POOL_NAME}/Docs/Logs"
LOG_FILE_NAME="TrueNAS to Proton.log"
LOG_FILE="${LOG_DIR}/${LOG_FILE_NAME}"

# The path to the file containing the desired exclusion patterns.
EXCLUDE_FILE="${LOG_DIR}/exclude.txt"
